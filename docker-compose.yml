services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    image: devops-portfolio:latest
    container_name: devops-portfolio
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - CONTACT_EMAIL=${CONTACT_EMAIL:-shirishmaharjan0@gmail.com}
