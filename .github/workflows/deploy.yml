name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-build:
    name: Test & Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js
        run: npm run build

  deploy:
    name: Deploy to AWS EC2
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Fetch Secrets from AWS SSM Parameter Store
        id: ssm
        run: |
          echo "==> Fetching parameters from AWS SSM Parameter Store..."
          RESEND_KEY=$(aws ssm get-parameter --name "/portfolio/RESEND_API_KEY" --with-decryption --query "Parameter.Value" --output text)
          CONTACT_EMAIL=$(aws ssm get-parameter --name "/portfolio/CONTACT_EMAIL" --query "Parameter.Value" --output text 2>/dev/null || echo "shirishmaharjan0@gmail.com")
          
          # Mask secret value in GitHub Actions logs
          echo "::add-mask::$RESEND_KEY"
          
          echo "RESEND_KEY=$RESEND_KEY" >> $GITHUB_ENV
          echo "CONTACT_EMAIL=$CONTACT_EMAIL" >> $GITHUB_ENV

      - name: Deploy on EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          RESEND_KEY: ${{ env.RESEND_KEY }}
          CONTACT_EMAIL: ${{ env.CONTACT_EMAIL }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          envs: RESEND_KEY,CONTACT_EMAIL
          script: |
            set -e
            echo "==> Deploying updates to EC2..."
            
            APP_DIR="${{ secrets.EC2_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then
              APP_DIR="$HOME/devops-portfolio"
            fi
            
            # Clone repo if first time setup, otherwise pull latest
            if [ ! -d "$APP_DIR" ]; then
              echo "==> Initial clone of repository..."
              git clone https://github.com/${{ github.repository }}.git "$APP_DIR"
            fi

            cd "$APP_DIR"

            echo "==> Pulling latest changes from origin/main..."
            git fetch origin main
            git reset --hard origin/main

            echo "==> Generating .env from SSM Parameter Store..."
            printf "NODE_ENV=production\nPORT=3000\nRESEND_API_KEY=%s\nCONTACT_EMAIL=%s\n" "$RESEND_KEY" "$CONTACT_EMAIL" > .env
            chmod 600 .env

            echo "==> Building and launching Docker container..."
            docker compose down || true
            docker compose up --build -d

            echo "==> Pruning dangling docker images..."
            docker image prune -f

            echo "==> Deployment successfully finished!"
            docker ps --filter "name=devops-portfolio"

  deploy-ecs:
    name: Build, Push to ECR & Restart ECS
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag & Push Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: portfolio
          IMAGE_TAG: latest
        run: |
          echo "==> Building Docker image for portfolio..."
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} .
          echo "==> Pushing image to ECR..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

      - name: Restart ECS Service with New Code
        run: |
          echo "==> Checking if ECS service exists and is active..."
          CLUSTER_NAME="multiapp-cluster-production"
          SERVICE_NAME="portfolio-service"
          REGION="${{ secrets.AWS_REGION || 'us-east-1' }}"

          SERVICE_STATUS=$(aws ecs describe-services --cluster "$CLUSTER_NAME" --services "$SERVICE_NAME" --region "$REGION" --query "services[?status=='ACTIVE'].status" --output text 2>/dev/null || true)

          if [ "$SERVICE_STATUS" = "ACTIVE" ]; then
            echo "==> Triggering zero-downtime rolling update on ECS service $SERVICE_NAME..."
            aws ecs update-service \
              --cluster "$CLUSTER_NAME" \
              --service "$SERVICE_NAME" \
              --force-new-deployment \
              --region "$REGION"
            echo "==> ECS deployment successfully triggered!"
          else
            echo "==> Note: ECS service $SERVICE_NAME is not currently active on $CLUSTER_NAME (skipped service restart)."
            echo "==> Image is ready in ECR: ${{ steps.login-ecr.outputs.registry }}/portfolio:latest"
          fi
